name: Fetch job feeds
on:
  schedule:
    - cron: "17 12 * * *"   # 4:17am PST / 5:17am PDT, before the daily scan
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_jobs.py
      - run: |
          git config user.name "job-feeds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Job feeds $(date -u +%F)" || echo "no changes"
          git push
